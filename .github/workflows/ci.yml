name: StellarVault CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build VaultLock
        run: cargo build --target wasm32v1-none --release
        working-directory: contracts/vaultlock
      - name: Run VaultLock Tests
        run: cargo test
        working-directory: contracts/vaultlock
      - name: Build Analytics
        run: cargo build --target wasm32v1-none --release
        working-directory: contracts/analytics
      - name: Run Analytics Tests
        run: cargo test
        working-directory: contracts/analytics

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm install
        working-directory: frontend
      - name: Run Type Check & Tests
        run: npm run test
        working-directory: frontend
      - name: Build Production Frontend Bundle
        run: npm run build
        working-directory: frontend
